[package]
name = "zscm-article"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "*", features = ["full"]}
axum = { version = "0.7.4" }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sqlx = { version = "0.6", features = [
    "runtime-tokio-native-tls",
    "sqlite",
    "json",
]}
clap = { version = "*", features = [ "derive" ] }
reqwest = { version = "*", features = ["json"]}
anyhow = "*"
toml = "*"
md5 = "*"
chrono = "*"
